<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Money Map — Foundation</title>
</head>
<body>
  <h1>Money Map — Foundation (Phase 1)</h1>
  <p>
    This page exists only to prove persistence works end-to-end (WASM SQLite
    + OPFS), per this Build Chat's scope. It is not the app UI.
  </p>
  <div id="status">Initializing…</div>
  <ul id="transaction-list"></ul>

  <section id="import-section">
    <h2>Import ING CSV</h2>

    <form id="import-mapping-form"></form>

    <input type="file" id="import-file-input" accept=".csv,text/csv" />
    <button type="button" id="import-preview-btn">Load &amp; Preview</button>
    <p id="import-error"></p>

    <div id="import-review-list"></div>

    <button type="button" id="import-confirm-btn" disabled>Confirm Import</button>
    <p id="import-summary"></p>
  </section>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
